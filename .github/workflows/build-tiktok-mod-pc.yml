name: Build TikTok Mod PC launcher

on:
  push:
    branches: [tiktok-mod-pc]
    paths:
      - 'pc-launcher/**'
      - '.github/workflows/build-tiktok-mod-pc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64 single-file app
        run: dotnet publish pc-launcher/TikTokModPC.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output artifacts
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Mod-PC-Windows-x64
          path: artifacts/TikTokModPC.exe
          if-no-files-found: error
          retention-days: 14
